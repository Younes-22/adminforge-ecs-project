name: Build & Push Docker

on:
  push:
    branches:
      - main
    paths:
      - 'app/AdminForge/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: my-adminforge-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.bnp_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app/AdminForge
          file: ./app/AdminForge/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: adminforge-app:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: adminforge-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag "adminforge-app:${GITHUB_SHA}" \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"